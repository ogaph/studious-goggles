<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recruitment Quiz — Live Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: host = projector stage (big PIN, question, timer, answer grid); player = phone pad (4 big shape buttons). One dark theme by choice. */
:root{
  --ink:#14112B; --panel:#211C45; --panel-2:#2D2760; --line:#3D3680;
  --fg:#F4F1FF; --muted:#ABA4D6; --accent:#FFD23F;
  --a0:#E0384F; --a1:#2B6FD6; --a2:#D99A08; --a3:#2E8F2A;
  --ok:#3FCF7A; --bad:#FF5C6C;
  --gold1:#FFE89A; --gold2:#D4A017; --silv1:#F2F4F8; --silv2:#9AA3B2; --brz1:#F3B27A; --brz2:#A2582A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:22px 22px}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.app{height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;padding-block:14px;gap:12px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.big{background:var(--accent);color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.25rem;padding:14px 22px;border-radius:12px;box-shadow:0 5px 0 #B8901A;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #B8901A}
.big:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);padding:10px 16px;border-radius:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--fg);font:inherit;font-size:1.15rem}
input.pin{font-family:var(--display);font-size:2rem;letter-spacing:.3em;text-align:center;font-weight:800}
.err{color:var(--bad);font-weight:500;min-height:1.4em;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums;font-weight:600}
.pill.score{color:var(--accent)}
.c0{background:var(--a0)}.c1{background:var(--a1)}.c2{background:var(--a2)}.c3{background:var(--a3)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}

/* home */
.home{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.home h1{font-size:clamp(2.2rem,6vw,4.4rem);font-weight:800;line-height:.95}
.home h1 span{color:var(--accent)}
.shapes{display:flex;gap:10px;margin-bottom:16px}
.shapes i{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-style:normal;color:#fff;font-size:1.1rem}
.hostlink{background:none;color:var(--muted);text-decoration:underline;padding:4px 0;text-align:left}

/* lobby */
.qr{background:#fff;padding:10px;border-radius:12px;line-height:0}.qr img,.qr canvas{display:block;width:150px;height:150px}
.lobby{flex:1;display:flex;flex-direction:column;gap:16px}.lobby .chips{flex:1}
.pinbox{background:var(--fg);color:var(--ink);border-radius:18px;padding:16px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.pinbox .pinv{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,11vw,7rem);letter-spacing:.12em;line-height:1;font-variant-numeric:tabular-nums}
.pinbox p{margin:0;max-width:34ch;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow:auto;padding:4px}
.chip{background:var(--panel-2);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:600;animation:pop .3s ease-out}
.chip.off{opacity:.4}
.count{font-family:var(--display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}

/* host question */
.qtext{background:var(--fg);color:var(--ink);border-radius:14px;padding:14px 20px;font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,2.6vw,1.9rem);text-align:center;line-height:1.2}
.mid{flex:1;min-height:0;display:grid;grid-template-columns:110px minmax(0,1fr) 110px;align-items:center;gap:12px}
.imgwrap{height:100%;min-height:0;display:flex}
.imgwrap img{max-height:100%;margin:auto;display:block;border-radius:12px;object-fit:contain;min-height:0}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.side b{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums;line-height:1}
.timer{width:96px;height:96px;position:relative}
.timer svg{transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center}
.timer.low b{color:var(--bad)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;color:#fff;padding:14px 16px;border-radius:12px;min-height:72px;font-size:clamp(.95rem,1.7vw,1.15rem);font-weight:500;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);position:relative;overflow:hidden;transition:opacity .25s}
.ans .sh{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:1.3rem}
.ans .txt{min-width:0;position:relative}
.ans .n{margin-left:auto;font-family:var(--display);font-weight:800;font-size:1.5rem;position:relative;font-variant-numeric:tabular-nums}
.ans .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.16);width:0;transition:width .6s ease-out}
.ans.dim{opacity:.3}
.feedback{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.feedback p{margin:0;flex:1;min-width:0;color:var(--muted)}
.feedback p strong{color:var(--fg)}

/* board */
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:min(720px,100%);margin-inline:auto}
.board li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel-2);border-radius:12px;padding:12px 16px;font-size:1.2rem;font-variant-numeric:tabular-nums;animation:slide .35s ease-out both}
.board li b{font-family:var(--display)}
.board li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.board li .up{color:var(--ok);font-size:.85rem;margin-left:8px}

/* podium */
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);min-height:0}
.place{display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(96px,22vw,230px);min-width:0}
.place .who{font-family:var(--display);font-weight:800;font-size:clamp(1rem,2.4vw,1.6rem);text-align:center;overflow-wrap:anywhere}
.place .pts{color:var(--muted);font-variant-numeric:tabular-nums}
.step{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:10px;font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.6rem);color:rgba(20,17,43,.55)}
.p1 .step{height:clamp(120px,26vh,240px);background:linear-gradient(var(--gold1),var(--gold2))}
.p2 .step{height:clamp(84px,18vh,170px);background:linear-gradient(var(--silv1),var(--silv2))}
.p3 .step{height:clamp(60px,12vh,120px);background:linear-gradient(var(--brz1),var(--brz2))}
.place{opacity:0;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) forwards}
.p3{animation-delay:.3s}.p2{animation-delay:1.1s}.p1{animation-delay:2s}

/* medal */
.medal{position:relative;width:var(--s,96px);height:calc(var(--s,96px)*1.35);flex:none}
.medal .rib{position:absolute;top:0;width:34%;height:52%;background:#C8102E}
.medal .rib.l{left:18%;transform:skewX(14deg);background:linear-gradient(90deg,#0099B5 50%,#F4F4F4 50%)}
.medal .rib.r{right:18%;transform:skewX(-14deg);background:linear-gradient(90deg,#F4F4F4 50%,#1EB53A 50%)}
.medal .disc{position:absolute;bottom:0;left:0;width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:calc(var(--s,96px)*.42);color:rgba(0,0,0,.45);
  box-shadow:inset 0 0 0 calc(var(--s,96px)*.07) rgba(255,255,255,.35),inset 0 -6px 12px rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.35)}
.medal .disc::after{content:"";position:absolute;inset:12%;border-radius:50%;border:2px dashed rgba(0,0,0,.18)}
.medal.gold .disc{background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 70%)}
.medal.silver .disc{background:radial-gradient(circle at 35% 30%,var(--silv1),var(--silv2) 70%)}
.medal.bronze .disc{background:radial-gradient(circle at 35% 30%,var(--brz1),var(--brz2) 70%)}
.p1 .medal{animation:shine 2.4s ease-in-out 2.6s infinite}

/* player */
.pad{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.pad button{color:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);font-size:.95rem;font-weight:500;text-align:center;min-height:120px}
.pad button .sh{font-size:2.6rem;line-height:1}
.pad button:active{transform:scale(.97)}
.verdictbg{flex:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.verdictbg.ok{background:var(--a3)}.verdictbg.bad{background:var(--a0)}.verdictbg.late{background:var(--panel-2)}
.verdictbg h2{font-size:clamp(2.2rem,9vw,3.6rem)}
.gain{font-family:var(--display);font-weight:800;font-size:2rem;background:rgba(0,0,0,.25);padding:6px 18px;border-radius:12px;font-variant-numeric:tabular-nums}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--panel-2);border-top-color:var(--accent);animation:spin 1s linear infinite}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
@media (max-width:760px){
  .home{grid-template-columns:1fr;align-items:start}
  .answers{grid-template-columns:1fr}
  .mid{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr)}
  .mid .imgwrap{grid-column:1/-1;grid-row:2}
  html,body{height:auto}.app{min-height:100vh}
}
</style>
</head>

<script>
/* Minimal MQTT 3.1.1 client over WebSocket (QoS 0) */
function Mqtt(url){
  const te=new TextEncoder(),td=new TextDecoder(),self={url:url,open:false,onmsg:null,onclose:null};
  let ws=null,buf=new Uint8Array(0),pid=1,ping=null;
  const cat=function(){let n=0;for(const a of arguments)n+=a.length;const o=new Uint8Array(n);let i=0;for(const a of arguments){o.set(a,i);i+=a.length}return o};
  const str=s=>{const b=te.encode(s);return cat(new Uint8Array([b.length>>8,b.length&255]),b)};
  const pkt=(h,body)=>{const len=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d)}while(n>0);return cat(new Uint8Array([h].concat(len)),body)};
  self.connect=()=>new Promise((res,rej)=>{
    let settled=false;const ok=v=>{if(!settled){settled=true;res(v)}},bad=e=>{if(!settled){settled=true;rej(e)}};
    try{ws=new WebSocket(url,"mqtt")}catch(e){bad(e);return}
    ws.binaryType="arraybuffer";
    const to=setTimeout(()=>{bad(new Error("no response (7 s)"));try{ws.close()}catch(e){}},7000);
    ws.onopen=()=>{const id="jv"+Math.random().toString(36).slice(2,12);
      try{ws.send(pkt(0x10,cat(str("MQTT"),new Uint8Array([4,2,0,30]),str(id))))}catch(e){bad(e)}};
    ws.onmessage=e=>{const a=new Uint8Array(e.data);buf=cat(buf,a);parse()};
    const closed=ev=>{clearTimeout(to);clearInterval(ping);const was=self.open;self.open=false;bad(new Error(ev&&ev.code?"closed ("+ev.code+")":"could not connect"));
      if(was&&self.onclose){const f=self.onclose;self.onclose=null;f()}};
    ws.onclose=closed;ws.onerror=closed;
    function parse(){for(;;){if(buf.length<2)return;let mul=1,len=0,i=1,d;
      do{if(i>=buf.length)return;d=buf[i++];len+=(d&127)*mul;mul*=128}while(d&128);
      if(buf.length<i+len)return;const hdr=buf[0],type=hdr>>4,body=buf.slice(i,i+len);buf=buf.slice(i+len);
      if(type===2){clearTimeout(to);if(body[1]===0){self.open=true;ping=setInterval(()=>{try{ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);ok(self)}else{bad(new Error("refused"));try{ws.close()}catch(e){}}}
      else if(type===3){const tl=(body[0]<<8)|body[1],topic=td.decode(body.subarray(2,2+tl));let off=2+tl;if((hdr>>1)&3)off+=2;
        let msg=null;try{msg=JSON.parse(td.decode(body.subarray(off)))}catch(e){}
        if(msg&&typeof msg==="object"&&self.onmsg){try{self.onmsg(topic,msg)}catch(e){console.error(e)}}}
    }}
  });
  self.sub=topic=>{if(!self.open)return;try{ws.send(pkt(0x82,cat(new Uint8Array([pid>>8&255,pid&255]),str(topic),new Uint8Array([0]))));pid=pid%65000+1}catch(e){}};
  self.pub=(topic,obj)=>{if(!self.open)return false;try{ws.send(pkt(0x30,cat(str(topic),te.encode(JSON.stringify(obj)))));return true}catch(e){return false}};
  self.close=()=>{self.onclose=null;self.open=false;clearInterval(ping);try{ws.close()}catch(e){}};
  return self;
}
const BROKERS=window.__BROKERS||["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://mqtt.eclipseprojects.io/mqtt","wss://test.mosquitto.org:8081/mqtt","wss://broker-cn.emqx.io:8084/mqtt","wss://broker.mqttdashboard.com:8884/mqtt"];
const ROOT="abd-recruitment-v1/";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
</script>
<script>
/* Minimal QR encoder: byte mode, error correction M, versions 1–20 */
function qrMatrix(text){
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26];
  const NB=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16];
  const data=Array.from(new TextEncoder().encode(text));
  const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
  const dataCw=v=>Math.floor(rawMods(v)/8)-ECC[v]*NB[v];
  let ver=1;for(;ver<=20;ver++){if(4+(ver<10?8:16)+data.length*8<=dataCw(ver)*8)break}
  if(ver>20)throw new Error("too long");
  const bits=[],ap=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
  ap(4,4);ap(data.length,ver<10?8:16);data.forEach(b=>ap(b,8));
  const cap=dataCw(ver)*8;ap(0,Math.min(4,cap-bits.length));ap(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)ap(p,8);
  const dcw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];dcw.push(b)}
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const eb=ECC[ver],nb=NB[ver];
  const div=new Array(eb).fill(0);div[eb-1]=1;let root=1;
  for(let i=0;i<eb;i++){for(let j=0;j<eb;j++){div[j]=mul(div[j],root);if(j+1<eb)div[j]^=div[j+1]}root=mul(root,2)}
  const rem=d=>{const r=new Array(eb).fill(0);for(const b of d){const f=b^r.shift();r.push(0);for(let i=0;i<eb;i++)r[i]^=mul(div[i],f)}return r};
  const raw=Math.floor(rawMods(ver)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb),blocks=[];
  for(let i=0,k=0;i<nb;i++){const d=dcw.slice(k,k+sl-eb+(i<ns?0:1));k+=d.length;const e=rem(d);if(i<ns)d.push(0);blocks.push(d.concat(e))}
  const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-eb||j>=ns)cw.push(b[i])});
  const size=ver*4+17,M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  if(ver>1){const na=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(na*2-2))*2,pos=[6];for(let p=size-7;pos.length<na;p-=step)pos.splice(1,0,p);
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}}
  const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
  fmt(0);
  if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;

function beep(f,d=.12,type="sine",v=.08){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

function confetti(ms=6000){const c=$("#fx");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;c.hidden=false;
  const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#FFD23F","#E0384F","#2B6FD6","#3FCF7A","#F4F1FF","#D4A017"];
  const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,va:-.1+Math.random()*.2,col:cols[Math.random()*cols.length|0]}));
  const end=performance.now()+ms;
  (function f(t){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=p.va;if(p.y>c.height&&t<end){p.y=-10;p.x=Math.random()*c.width}
    x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t<end+3000)requestAnimationFrame(f);else{c.hidden=true}})(performance.now());}

const H={pin:"",id:Math.random().toString(36).slice(2,10),links:[],players:new Map(),byId:new Map(),state:"lobby",i:-1,t0:0,answers:new Map(),tick:null,prevRank:new Map(),lastOnline:-1};
const isOn=p=>p.link&&p.link.open&&Date.now()-p.seen<16000;
const online=()=>[...H.players.values()].filter(isOn);
function send(p,m){if(p.link&&p.link.open)p.link.pub(ROOT+H.pin+"/p/"+p.id,m)}
function bcast(m){H.players.forEach(p=>send(p,m))}
function ranking(){return [...H.players.values()].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name))}

async function connectAll(){
  const out=[];
  const tries=BROKERS.map(u=>Mqtt(u).connect().then(l=>{out.push(l);return l},()=>null));
  await Promise.race([new Promise(r=>{tries.forEach(t=>t.then(l=>{if(l)r()}));Promise.all(tries).then(r)}),sleep(9000)]);
  if(!out.length)return [];
  await Promise.race([Promise.all(tries),sleep(2500)]);
  const got=out.slice();
  tries.forEach(t=>t.then(l=>{if(l&&!got.includes(l)){if(H.pin)attach(l);else l.close()}}));
  return got;
}
function attach(link){
  link.onmsg=(topic,d)=>hostData(link,d);
  link.onclose=()=>{H.links=H.links.filter(x=>x!==link);reattach(link.url)};
  link.sub(ROOT+H.pin+"/h");
  if(!H.links.includes(link))H.links.push(link);
}
async function reattach(url){
  for(let n=0;n<30&&H.pin;n++){await sleep(2000+n*1000);
    try{const l=await Mqtt(url).connect();attach(l);return}catch(e){}}
}
async function hostCreate(){
  beep(520,.08);waitScreen("Creating the game…","Connecting to servers, please wait a few seconds");
  const links=await connectAll();
  if(!links.length){renderDiag();return}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
  window.addEventListener("beforeunload",e=>{if(H.players.size){e.preventDefault();e.returnValue=""}});
  for(let n=0;n<5;n++){
    const pin=String(1000+Math.floor(Math.random()*9000));H.pin=pin;H.taken=false;
    links.forEach(attach);
    await sleep(400);links.forEach(l=>l.pub(ROOT+pin+"/h",{t:"probe",from:H.id}));
    await sleep(1200);
    if(!H.taken)break;
    links.forEach(l=>{l.onmsg=null});H.links=[];
  }
  setInterval(()=>{const n=online().length;if(n!==H.lastOnline){H.lastOnline=n;refreshHost()}},2000);
  hostLobby();
}

    <ol class="board" id="dg" style="width:100%"></ol>
    <p class="muted" id="dgtip" style="margin:0"></p>
    <div class="row"><button class="big" id="retry" type="button">Try again</button></div></div></div>`;
  $("#retry").onclick=hostCreate;
  const tests=[["Internet (google)",async()=>{await fetch("https://www.google.com/generate_204",{mode:"no-cors",cache:"no-store"});return "OK"}],
    ["WebSocket (echo)",()=>new Promise((res,rej)=>{let w;try{w=new WebSocket("wss://echo.websocket.org")}catch(e){rej(e);return}
      const t=setTimeout(()=>{rej(new Error("no response"));try{w.close()}catch(e){}},7000);
      w.onopen=()=>{clearTimeout(t);w.close();res("works")};w.onerror=()=>{clearTimeout(t);rej(new Error("blocked"))}})]]
    .concat(BROKERS.map(u=>[u.replace(/^wss:\/\//,"").replace(/\/mqtt$/,""),async()=>{const l=await Mqtt(u).connect();l.close();return "works"}]));
  const ul=$("#dg");let okWs=0,okNet=false;
  ul.innerHTML=tests.map((t,i)=>`<li><b id="dgi${i}">…</b><span>${esc(t[0])}</span><b id="dgr${i}" class="muted" style="font-weight:500">checking</b></li>`).join("");
  await Promise.all(tests.map(async(t,i)=>{const t0=performance.now();
    try{const r=await t[1]();$("#dgi"+i).textContent="✓";$("#dgi"+i).style.color="var(--ok)";$("#dgr"+i).textContent=r+" · "+Math.round(performance.now()-t0)+" ms";if(i===0)okNet=true;if(i===1)okWs++}
    catch(e){$("#dgi"+i).textContent="✗";$("#dgi"+i).style.color="var(--bad)";$("#dgr"+i).textContent=(e&&e.message)||"error"}}));
  $("#dgtip").textContent=!okNet?"This computer seems to have no internet.":okWs?"The internet works, but the game servers are blocked on this network. Turn on your phone’s mobile hotspot, connect the computer to it and try again.":"This network or browser blocks WebSocket connections. Try another browser (Chrome) or another connection (mobile hotspot). Antivirus “web protection” can also block it.";
}
function hostData(link,d){
  if(!d||typeof d!=="object")return;
  if(d.t==="probe"){if(d.from!==H.id)link.pub(ROOT+H.pin+"/h",{t:"taken",from:H.id});return}
  if(d.t==="taken"){if(d.from!==H.id)H.taken=true;return}
  const id=String(d.id||"");if(!/^[a-z0-9]{6,20}$/.test(id))return;
  const reply=m=>link.pub(ROOT+H.pin+"/p/"+id,m);
  if(d.t==="join"){
    const name=cleanName(d.name);if(!name){reply({t:"err",m:"Please enter your name."});return}
    const key=name.toLowerCase();let p=H.players.get(key);
    if(p&&p.id!==id&&isOn(p)){reply({t:"err",m:"This name is taken. Please choose another one."});return}
    if(!p){p={key,name,score:0,streak:0,correct:0};H.players.set(key,p);beep(740,.08,"triangle",.05)}
    if(p.id&&p.id!==id)H.byId.delete(p.id);
    p.id=id;p.link=link;p.seen=Date.now();H.byId.set(id,key);
    send(p,{t:"welcome",name:p.name,score:p.score});
    if(H.state==="q"){const left=TIME-(performance.now()-H.t0)/1000;if(left>1&&!H.answers.has(key))send(p,{t:"q",i:H.i,total:Q.length,a:Q[H.i].a,dur:left})}
    H.lastOnline=online().length;refreshHost();return;
  }
  const p=H.players.get(H.byId.get(id));if(!p)return;
  p.seen=Date.now();p.link=link;
  if(d.t==="ans"){
    if(H.state!=="q"||d.i!==H.i||H.answers.has(p.key))return;
    const k=d.k|0;if(k<0||k>3)return;
    const el=(performance.now()-H.t0)/1000;if(el>TIME+1)return;
    H.answers.set(p.key,{k,el});send(p,{t:"got"});
    const cnt=$("#cnt");if(cnt)cnt.textContent=H.answers.size;
    if(H.answers.size>=online().length)setTimeout(reveal,700);
  }
}
function refreshHost(){if(H.state==="lobby")hostLobby();else{const o=$("#onl");if(o)o.textContent=online().length}}

function hostLobby(){
  H.state="lobby";const ps=[...H.players.values()];
  app.innerHTML=`<div class="screen"><div class="lobby">
    <div class="pinbox"><div><div class="label" style="color:#5b5480">Game PIN</div><div class="pinv">${H.pin}</div></div>
      <p>On your phone open <b>${esc(location.host+location.pathname.replace(/[^/]*$/,""))}</b> or <b>scan the QR code</b>, then enter the <b>PIN</b> and <b>your name</b> and tap “Join”.</p><div class="qr" id="qr" hidden></div></div>
    <div class="row" id="qrnote" hidden><span class="muted" style="font-size:.9rem">Paste the student page link to show a QR code:</span>
      <input id="qrurl" style="flex:1;min-width:220px;font-size:.95rem;padding:10px 12px" placeholder="https://…" inputmode="url"></div>
    <div class="chips" id="chips">${ps.length?ps.map(p=>`<span class="chip ${isOn(p)?'':'off'}">${esc(p.name)}</span>`).join(""):'<p class="muted" style="margin:auto">Waiting for players…</p>'}</div>
    <div class="row"><span class="count">${online().length}</span><span class="muted">players joined</span><span class="spacer"></span>
      <button class="big" id="startb" type="button" ${online().length?"":"disabled"}>Start game</button></div>
  </div></div>`;
  $("#startb").onclick=()=>{fanfare();H.prevRank=new Map();hostQuestion(0)};
  const box=$("#qr");
  const draw=url=>{box.innerHTML="";try{box.appendChild(qrCanvas(url,300));box.hidden=false}catch(e){}};
  if(/^https?:$/.test(location.protocol)){draw(location.origin+location.pathname.replace(/[^/]*$/,"")+"#"+H.pin)}
  else{$("#qrnote").hidden=false;const inp=$("#qrurl");if(H.qrBase){inp.value=H.qrBase;draw(H.qrBase.split("#")[0]+"#"+H.pin)}
    inp.onchange=()=>{const v=inp.value.trim();if(/^https?:\/\//.test(v)){H.qrBase=v;draw(v.split("#")[0]+"#"+H.pin)}}}
}

function hostQuestion(i){
  H.state="q";H.i=i;H.answers=new Map();const q=Q[i];
  bcast({t:"q",i,total:Q.length,a:q.a,dur:TIME});H.t0=performance.now();
  app.innerHTML=`<div class="screen" style="animation:pop .3s ease-out">
    <div class="row"><span class="pill">${i+1} / ${Q.length}</span><span class="pill">PIN ${H.pin}</span><span class="spacer"></span>
      <button class="ghost" id="skip" type="button">Show answers</button></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="mid">
      <div class="side">${timerSVG()}<span class="label">seconds</span></div>
      <div class="imgwrap"><img src="${q.img}" alt="Illustration for question ${i+1}"></div>
      <div class="side"><b id="cnt">0</b><span class="label">answered</span><span class="muted" style="font-size:.85rem"><span id="onl">${online().length}</span> players</span></div>
    </div>
    <div class="answers">${q.a.map((t,k)=>`<div class="ans c${k}" data-k="${k}"><span class="fill"></span><span class="sh">${SH[k]}</span><span class="txt">${esc(t)}</span><span class="n"></span></div>`).join("")}</div>
  </div>`;
  $("#skip").onclick=reveal;
  clearInterval(H.tick);let lastS=TIME;
  H.tick=setInterval(()=>{const left=Math.max(0,TIME-(performance.now()-H.t0)/1000);setTimer(left,TIME);
    const s=Math.ceil(left);if(s!==lastS){lastS=s;if(s<=5&&s>0)beep(880,.05,"triangle",.04)}
    if(left<=0)reveal()},100);
}

function reveal(){
  if(H.state!=="q")return;H.state="reveal";clearInterval(H.tick);
  const q=Q[H.i],counts=[0,0,0,0];
  H.answers.forEach(a=>counts[a.k]++);
  H.players.forEach(p=>{const a=H.answers.get(p.key),right=!!a&&a.k===q.c;let gain=0;
    if(right){p.streak++;p.correct++;gain=Math.round(1000*(1-a.el/TIME/2))+Math.min(500,(p.streak-1)*100)}else p.streak=0;
    p.gain=gain;p.score+=gain;p.lastRight=right;p.answered=!!a});
  const r=ranking();
  r.forEach((p,idx)=>send(p,{t:"res",right:p.lastRight,answered:p.answered,gain:p.gain,score:p.score,rank:idx+1,of:r.length,streak:p.streak}));
  beep(660,.15);
  const max=Math.max(1,...counts);
  document.querySelectorAll(".ans").forEach(b=>{const k=+b.dataset.k;if(k!==q.c)b.classList.add("dim");
    b.querySelector(".n").textContent=(k===q.c?"✓ ":"")+counts[k];b.querySelector(".fill").style.width=(counts[k]/max*100)+"%"});
  $("#skip").remove();const mid=$(".mid");
  mid.insertAdjacentHTML("afterend",`<div class="feedback"><p><strong>Correct answer: ${"ABCD"[q.c]}) ${esc(q.a[q.c])}</strong> ${esc(q.ex)}</p>
    <button class="big" id="nx" type="button">Leaderboard</button></div>`);
  $("#nx").onclick=hostBoard;$("#nx").focus();
}

function hostBoard(){
  H.state="board";const r=ranking(),last=H.i===Q.length-1;
  const rows=r.slice(0,5).map((p,idx)=>{const prev=H.prevRank.get(p.key),up=prev&&prev>idx+1?`<span class="up">▲${prev-idx-1}</span>`:"";
    return `<li style="animation-delay:${idx*.08}s"><b>${idx+1}</b><span>${esc(p.name)}${up}</span><b>${p.score}</b></li>`}).join("");
  r.forEach((p,idx)=>H.prevRank.set(p.key,idx+1));
  app.innerHTML=`<div class="screen"><div class="row"><span class="pill">${H.i+1} / ${Q.length}</span><span class="spacer"></span></div>
    <div class="center" style="justify-content:flex-start;gap:20px"><h2 style="font-size:clamp(1.8rem,4vw,2.8rem)">Leaderboard</h2>
    <ol class="board">${rows||'<li><b>–</b><span>No players yet</span><b></b></li>'}</ol></div>
    <div class="row"><span class="spacer"></span><button class="big" id="nx" type="button">${last?"Announce the winners":"Next question"}</button></div></div>`;
  $("#nx").onclick=()=>last?hostEnd():hostQuestion(H.i+1);$("#nx").focus();
}

function hostEnd(){
  H.state="end";const r=ranking();
  r.forEach((p,idx)=>send(p,{t:"end",rank:idx+1,of:r.length,score:p.score,correct:p.correct,total:Q.length}));
  const slot=(idx,cls)=>{const p=r[idx];if(!p)return `<div class="place ${cls}" style="visibility:hidden"><div class="step"></div></div>`;
    return `<div class="place ${cls}">${medal(MEDAL[idx],idx+1,idx===0?120:92)}<div class="who">${esc(p.name)}</div><div class="pts">${p.score} pts · ${p.correct}/${Q.length}</div><div class="step">${idx+1}</div></div>`};
  const rest=r.slice(3,10).map((p,k)=>`<li><b>${k+4}</b><span>${esc(p.name)}</span><b>${p.score}</b></li>`).join("");
  app.innerHTML=`<div class="screen"><div class="row"><h2 style="font-size:clamp(1.6rem,4vw,2.6rem)">Winners</h2><span class="spacer"></span>
      <button class="ghost" id="again" type="button">New game (same players)</button></div>
    <div class="podium">${slot(1,"p2")}${slot(0,"p1")}${slot(2,"p3")}</div>
    ${rest?`<ol class="board" style="margin-top:6px">${rest}</ol>`:""}</div>`;
  setTimeout(()=>{fanfare();confetti()},2100);
  $("#again").onclick=()=>{H.players.forEach(p=>{p.score=0;p.streak=0;p.correct=0});bcast({t:"lobby"});hostLobby()};
}

/* ================= PLAYER ================= */
const P={pin:"",name:"",id:"",link:null,score:0,tick:null,hb:null,i:-1,locked:false,joined:false,fail:null,welcomed:false};
try{P.id=sessionStorage.getItem("jv_id")||""}catch(e){}
if(!/^[a-z0-9]{6,20}$/.test(P.id)){P.id=Math.random().toString(36).slice(2,12).replace(/[^a-z0-9]/g,"")+"x0";try{sessionStorage.setItem("jv_id",P.id)}catch(e){}}
function toHost(m){return P.link&&P.link.open&&P.link.pub(ROOT+P.pin+"/h",Object.assign({id:P.id},m))}
async function findGame(){
  for(const url of BROKERS){
    let l;try{l=await Mqtt(url).connect()}catch(e){continue}
    P.welcomed=false;P.link=l;l.onmsg=(t,d)=>{if(d.t==="welcome"||d.t==="err")P.welcomed=true;playerData(d)};
    l.sub(ROOT+P.pin+"/p/"+P.id);await sleep(300);
    for(let k=0;k<4&&!P.welcomed;k++){toHost({t:"join",name:P.name});await sleep(1200)}
    if(P.welcomed){l.onclose=playerLost;return true}
    l.close();P.link=null;
  }
  return false;
}
async function playerJoin(pin,name){
  P.pin=pin;P.name=name;P.joined=false;clearInterval(P.hb);
  try{P.link&&P.link.close()}catch(e){}P.link=null;
  waitScreen("Connecting…","PIN "+pin);
  let done=false;
  P.fail=m=>{if(done)return;done=true;clearInterval(P.hb);try{P.link&&P.link.close()}catch(e){}P.link=null;P.joined=false;renderHome(m);const pi=$("#pin");if(pi)pi.value=pin;const n=$("#nm");if(n)n.value=name};
  const ok=await findGame();
  if(done)return;
  if(!ok){P.fail("No game found with this PIN. Check the code on the teacher’s screen. If it is correct, try another connection (Wi-Fi or mobile data).");return}
  P.hb=setInterval(()=>toHost({t:"hb"}),5000);
}
async function playerLost(){
  clearInterval(P.hb);P.link=null;if(!P.joined)return;
  const box=document.createElement("div");box.className="pill";box.id="recon";box.textContent="Connection lost — reconnecting…";
  box.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--bad);color:#fff";
  document.body.appendChild(box);
  for(let n=0;n<20;n++){if(await findGame()){P.hb=setInterval(()=>toHost({t:"hb"}),5000);box.remove();return}await sleep(2000)}
  box.remove();P.joined=false;
  app.innerHTML=`<div class="screen"><div class="center"><h2>Connection lost</h2><p class="muted">Your points are saved. Join again.</p>
    <button class="big" id="rj" type="button">Reconnect</button></div></div>`;
  $("#rj").onclick=()=>playerJoin(P.pin,P.name)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&P.joined&&!(P.link&&P.link.open)&&!$("#recon"))playerLost()});
function pbar(extra=""){return `<div class="row"><span class="pill">${esc(P.name)}</span>${extra}<span class="spacer"></span><span class="pill score">${P.score}</span></div>`}
function playerData(d){
  if(!d||typeof d!=="object")return;
  if(d.t==="err"){P.fail&&P.fail(d.m||"Error");return}
  if(d.t==="welcome"||d.t==="lobby"){P.joined=true;if(d.t==="lobby")P.score=0;else P.score=d.score|0;P.name=d.name||P.name;clearInterval(P.tick);
    app.innerHTML=`<div class="screen">${pbar()}<div class="center"><div class="shapes" style="justify-content:center">${SH.map((s,k)=>`<i class="c${k}">${s}</i>`).join("")}</div>
      <h2 style="font-size:2rem">You’re in!</h2><p class="muted">Can you see your name on the screen? Wait for the teacher to start the game.</p></div></div>`;return}
  if(d.t==="q"){P.i=d.i;P.locked=false;const t0=performance.now(),dur=+d.dur||TIME;
    app.innerHTML=`<div class="screen">${pbar(`<span class="pill">${d.i+1} / ${d.total}</span><span class="pill" id="pt">${Math.ceil(dur)}</span>`)}
      <div class="pad">${(d.a||[]).slice(0,4).map((t,k)=>`<button class="c${k}" data-k="${k}" type="button"><span class="sh">${SH[k]}</span><span>${esc(t)}</span></button>`).join("")}</div></div>`;
    app.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{if(P.locked)return;P.locked=true;clearInterval(P.tick);
      toHost({t:"ans",i:P.i,k:+b.dataset.k});
      try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
      app.innerHTML=`<div class="screen">${pbar()}<div class="center"><div class="spin"></div><h2>Answer received</h2><p class="muted">Waiting for the others…</p></div></div>`});
    clearInterval(P.tick);P.tick=setInterval(()=>{const left=Math.max(0,dur-(performance.now()-t0)/1000),el=$("#pt");if(el)el.textContent=Math.ceil(left);
      if(left<=0&&!P.locked){P.locked=true;clearInterval(P.tick);app.innerHTML=`<div class="screen">${pbar()}<div class="center"><h2>Time’s up</h2><p class="muted">Waiting for the result…</p></div></div>`}},200);return}
  if(d.t==="res"){clearInterval(P.tick);P.score=d.score|0;
    const cls=d.right?"ok":(d.answered?"bad":"late"),title=d.right?"Correct!":(d.answered?"Wrong":"No answer");
    if(d.right)beep(880,.12);
    app.innerHTML=`<div class="screen">${pbar()}<div class="verdictbg ${cls}"><h2>${title}</h2>${d.right?`<div class="gain">+${d.gain}</div>`:""}
      ${d.right&&d.streak>1?`<p>${d.streak} correct in a row!</p>`:""}<p style="font-size:1.2rem">You are <b>#${d.rank}</b> of ${d.of}</p></div></div>`;return}
  if(d.t==="end"){clearInterval(P.tick);P.score=d.score|0;const top=d.rank<=3;
    app.innerHTML=`<div class="screen">${pbar()}<div class="center">
      ${top?medal(MEDAL[d.rank-1],d.rank,140):`<div class="count" style="font-size:4rem">${d.rank}</div>`}
      <h2 style="font-size:2.2rem">${top?["Gold medal!","Silver medal!","Bronze medal!"][d.rank-1]:"Place "+d.rank}</h2>
      <p class="muted">${d.score} pts · ${d.correct} / ${d.total} correct · ${d.of} players</p></div></div>`;
    if(top){fanfare();confetti(5000)}}
}

renderHome();
</script>
</body>
